# Library tests on every PR and push to main.
# Codacy quality analysis continues via the Codacy GitHub App; this workflow
# adds functional cargo test gates that Codacy does not run.
#
# Third-party actions are pinned to full commit SHAs (immutable releases).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stock misaki 0.9.4 parity gate (fixtures built with fallback=None).
          - name: no-default-features
            cargo_flags: --no-default-features
            install_espeak: false
          # Default feature set, including espeak-ng OOV fallback.
          - name: default-features
            cargo_flags: ""
            install_espeak: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install espeak-ng
        if: matrix.install_espeak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng libespeak-ng-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run all library, integration, and binary tests
        run: cargo test ${{ matrix.cargo_flags }} --workspace --all-targets --verbose

      - name: Run documentation tests
        run: cargo test ${{ matrix.cargo_flags }} --doc --verbose

      - name: Build examples that require espeak
        if: matrix.install_espeak
        run: cargo build --examples --verbose
