[package]
name = "misaki-rs"
version = "0.12.0"
edition = "2024"
license = "MIT"
description = "A self-contained, POS-aware Grapheme-to-Phoneme (G2P) engine for Rust, optimized for TTS models like Kokoro."
homepage = "https://github.com/MicheleYin/misaki-rs"
repository = "https://github.com/MicheleYin/misaki-rs"
readme = "README.md"
exclude = [
	"tests/**",
	"tools/**",
	"examples/**",
	"expand_dicts.py",
	"data.txt",
	"data_test.txt",
	"PARITY.md",
]

[features]
default = ["espeak"]
espeak = ["dep:espeak-rs"]
# Corrections to misaki 0.9.4 mistakes (off by default). Stock builds stay
# byte-identical to 0.9.4; see FIXES.md. Based on #30–#33 by @homeygravity.
fixes = []

[dependencies]
log = "0.4"
regex = "1.10"
num2words = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fancy-regex = "0.13"
language-tokenizer = { version = "0.1", features = ["snowball"] }
espeak-rs = { version = "0.1.9", optional = true }
thiserror = "2.0"
unicode-normalization = "0.1"

[dev-dependencies]
env_logger = "0.11"

[[example]]
name = "test_stress_fix"
required-features = ["espeak"]
