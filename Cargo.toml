[package]
name = "misaki-rs"
version = "0.12.0"
edition = "2024"
license = "MIT"
description = "A self-contained, POS-aware Grapheme-to-Phoneme (G2P) engine for Rust, optimized for TTS models like Kokoro."
homepage = "https://github.com/MicheleYin/misaki-rs"
repository = "https://github.com/MicheleYin/misaki-rs"
readme = "README.md"
exclude = [
	"tests/**",
	"tools/**",
	"examples/**",
	"expand_dicts.py",
	"data.txt",
	"data_test.txt",
	"PARITY.md",
]

[features]
# Default users get the full bundle (espeak + silver + GB). Slim builds use
# `default-features = false` and re-enable only what they need (#34).
default = ["espeak", "silver", "gb"]
espeak = ["dep:espeak-rs"]
# Embed us_silver.json (and gb_silver.json when `gb` is also enabled).
silver = []
# Embed British lexicons and enable Language::EnglishGB.
gb = []

[dependencies]
log = "0.4"
regex = "1.10"
num2words = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fancy-regex = "0.13"
espeak-rs = { version = "0.1.9", optional = true }
thiserror = "2.0"
unicode-normalization = "0.1"

[dev-dependencies]
env_logger = "0.11"

[[example]]
name = "test_stress_fix"
required-features = ["espeak"]
